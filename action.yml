name: Sign and release PyPI package
description: Signs PyPI distributions with Sigstore and attaches them to the GitHub release.

branding:
  icon: lock
  color: blue

inputs:
  tag-name:
    description: >
      Tag/release to attach the signed assets to. Leave unset to use the tag
      that triggered the workflow (the normal case, github.ref_name). Set
      explicitly when testing this action from a non-tag trigger.
    required: false
    default: ""
  dist-artifact-name:
    description: >
      Name of the artifact that holds the distributions and SHA256SUMS.
    required: false
    default: "dist"
  github-token:
    description: >
      Token used to create the release if needed and attach the assets. Needs contents: write.
    required: false
    default: ${{ github.token }}

outputs:
  failed-check:
    description: >
      Id of the check that failed, "unexpected" for any other failure, empty on success. The ids
      (tag, checksums-file, file-set, checksum, permissions, bundle, release) are listed in the README table.
    value: ${{ steps.report.outputs.failed-check }}

runs:
  using: composite
  steps:
    - name: 0.1 Define failure helper
      shell: bash
      run: |
        # A second run in the same job must not see the files or the state of the first one.
        rm -rf "${RUNNER_TEMP}/failed-check" "${RUNNER_TEMP}/sign-pypi-package"
        cat >"${RUNNER_TEMP}/fail.sh" <<'EOF'
        # fail <id> <title> <details> <how to fix>: record the check id, annotate, summarize, exit 1.
        # The details can come from the artifact, so they are escaped for the annotation (toolkit
        # rules) and fenced in the summary with a fence longer than any run of '~' in them.
        fail() {
          local msg="${3//'%'/%25}" fence='~~~~~~'
          msg="${msg//$'\r'/%0D}"
          msg="${msg//$'\n'/%0A}"
          while [[ "$3" == *"${fence}"* ]]; do fence+='~'; done
          echo "$1" >"${RUNNER_TEMP}/failed-check"
          echo "::error title=$2::${msg}"
          printf '### :x: %s\n\n%stext\n%s\n%s\n\n**How to fix:** %s\n' "$2" "${fence}" "$3" "${fence}" "$4" >>"${GITHUB_STEP_SUMMARY}"
          exit 1
        }
        EOF

    - name: 0.2 Resolve tag
      id: tag
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag-name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        tag="${INPUT_TAG}"
        if [ -z "${tag}" ] && [ "${REF_TYPE}" = "tag" ]; then
          tag="${REF_NAME}"
        fi
        [ -n "${tag}" ] || fail tag "No release tag" \
          "The run was not triggered by a tag (ref: ${REF_TYPE} ${REF_NAME}) and tag-name is not set." \
          "Run the workflow on a tag push, or set the tag-name input."
        case "${tag}" in
          -* | *[[:space:]]*) fail tag "Invalid release tag" "Tag '${tag}' starts with '-' or contains whitespace." \
            "Use a valid tag name." ;;
        esac
        echo "tag=${tag}" >>"${GITHUB_OUTPUT}"

    - name: 1.1 Download distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
      with:
        name: ${{ inputs.dist-artifact-name }}
        path: ${{ runner.temp }}/sign-pypi-package

    - name: 1.2 Check SHA256SUMS
      id: sums
      shell: bash
      env:
        DIST: ${{ runner.temp }}/sign-pypi-package
        ARTIFACT: ${{ inputs.dist-artifact-name }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        DIST="${DIST//\\//}" # forward slashes on Windows too
        cd "${DIST}" || exit
        [ -s SHA256SUMS ] || fail checksums-file "SHA256SUMS missing or empty" \
          "No non-empty SHA256SUMS in artifact '${ARTIFACT}'." \
          "Generate it at build time: sha256sum -- *.tar.gz *.whl > SHA256SUMS"
        bad="$(grep -nvE '^[0-9a-f]{64} [ *][A-Za-z0-9][A-Za-z0-9._+-]*\.(tar\.gz|whl)$' SHA256SUMS || true)"
        [ -z "${bad}" ] || fail checksums-file "Malformed SHA256SUMS line" "${bad}" \
          "Each line must be '<64 hex> <name>.tar.gz|.whl' with a plain file name (no path, no leading '.' or '-') and an LF line ending (not CRLF)."
        files="$(sed -E 's/^.{64} .//' SHA256SUMS | sort)"
        dup="$(echo "${files}" | uniq -d)"
        [ -z "${dup}" ] || fail checksums-file "Duplicate SHA256SUMS entry" "${dup}" \
          "List every distribution file exactly once."
        {
          echo "files=$(echo "${files}" | tr '\n' ' ')"
          # SHA256SUMS is signed too: it is the contract of the release.
          echo "inputs=${DIST}/SHA256SUMS $(echo "${files}" | sed "s|^|${DIST}/|" | tr '\n' ' ')"
        } >>"${GITHUB_OUTPUT}"

    - name: 1.3 Check distribution file set
      shell: bash
      env:
        DIST: ${{ runner.temp }}/sign-pypi-package
        FILES: ${{ steps.sums.outputs.files }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        DIST="${DIST//\\//}" # forward slashes on Windows too
        cd "${DIST}" || exit
        # Word splitting is intended: names are restricted to plain file names by step 1.2.
        # shellcheck disable=SC2086,SC2046
        expected="$(printf '%s\n' SHA256SUMS ${FILES} | sort)"
        # shellcheck disable=SC2012
        actual="$(ls -A | sort)"
        [ "${expected}" = "${actual}" ] || fail file-set "Artifact does not match SHA256SUMS" \
          "$(diff <(echo "${expected}") <(echo "${actual}") || true)" \
          "The artifact must contain SHA256SUMS and exactly the files it lists ('<' missing, '>' unexpected)."

    - name: 1.4 Verify checksums
      shell: bash
      env:
        DIST: ${{ runner.temp }}/sign-pypi-package
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        DIST="${DIST//\\//}" # forward slashes on Windows too
        cd "${DIST}" || exit
        # sha256sum is missing on macOS runners; shasum -a 256 works there and elsewhere.
        if command -v sha256sum >/dev/null 2>&1; then
          check=(sha256sum --check --strict SHA256SUMS)
        else
          check=(shasum -a 256 --check --strict SHA256SUMS)
        fi
        out="$("${check[@]}" 2>&1)" || fail checksum "Checksum mismatch" "${out}" \
          "A file changed after SHA256SUMS was generated. Rebuild and re-run the build job."

    - name: 2.1 Check signing permission
      shell: bash
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        # The runner sets this only when the job has id-token: write. Checking here avoids
        # downloading and verifying everything before Sigstore reports it.
        [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || fail permissions "Cannot sign: no OIDC token" \
          "The job has no id-token permission, so Sigstore keyless signing cannot work." \
          "Add 'permissions: id-token: write' to the job that runs this action."

    - name: 2.2 Sign with Sigstore
      uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # ratchet:sigstore/gh-action-sigstore-python@v3.5.0
      with:
        inputs: ${{ steps.sums.outputs.inputs }}
        release-signing-artifacts: false
        upload-signing-artifacts: false

    - name: 2.3 Check signature bundles
      shell: bash
      env:
        DIST: ${{ runner.temp }}/sign-pypi-package
        FILES: ${{ steps.sums.outputs.files }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        DIST="${DIST//\\//}" # forward slashes on Windows too
        cd "${DIST}" || exit
        # Word splitting is intended: names are restricted to plain file names by step 1.2.
        # shellcheck disable=SC2086
        for f in SHA256SUMS ${FILES}; do
          [ -s "${f}.sigstore.json" ] || fail bundle "Missing signature bundle" "${f}.sigstore.json was not written." \
            "Check the Sigstore signing step above."
        done

    - name: 3.1 Attach to release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        DIST: ${{ runner.temp }}/sign-pypi-package
        TAG: ${{ steps.tag.outputs.tag }}
        FILES: ${{ steps.sums.outputs.files }}
      run: |
        source "${RUNNER_TEMP}/fail.sh"
        DIST="${DIST//\\//}" # forward slashes on Windows too
        cd "${DIST}" || exit
        # A release that this run creates stays a draft until all assets are attached, so a failure
        # never leaves a public release that looks complete. A release that already exists is only
        # added to. Never --cleanup-tag: the tag existed before this run.
        created=0
        if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft --verify-tag --title "${TAG}" --notes "" ||
            fail release "Cannot create release ${TAG}" "gh release create failed for tag ${TAG}." \
              "Push the tag first and check that the token has contents: write."
          created=1
        fi
        # Word splitting is intended: names are restricted to plain file names by step 1.2.
        # shellcheck disable=SC2086,SC2046
        if gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" SHA256SUMS SHA256SUMS.sigstore.json ${FILES} $(printf '%s.sigstore.json ' ${FILES}) &&
          { [ "${created}" = 0 ] || gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false; }; then
          :
        else
          if [ "${created}" = 1 ]; then gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --yes || true; fi
          fail release "Cannot attach assets to ${TAG}" "gh failed to upload or publish; an asset may already exist (assets are never overwritten)." \
            "Fix the cause and re-run. A release created by this run was removed; an existing one may have partial assets: delete them first."
        fi

    - name: 4.1 Write job summary
      shell: bash
      env:
        DIST: ${{ runner.temp }}/sign-pypi-package
        TAG: ${{ steps.tag.outputs.tag }}
        FILES: ${{ steps.sums.outputs.files }}
      run: |
        DIST="${DIST//\\//}" # forward slashes on Windows too
        # Names are plain file names (step 1.2), so word splitting and printing them is safe.
        # shellcheck disable=SC2086
        {
          printf '### :white_check_mark: Signed and released %s\n\n' "${TAG}"
          printf 'Release: %s/%s/releases/tag/%s\n\nAssets:\n\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${TAG}"
          printf -- '- `%s`\n' SHA256SUMS SHA256SUMS.sigstore.json ${FILES} $(printf '%s.sigstore.json ' ${FILES})
          printf '\nVerify a file:\n\n```bash\nuvx sigstore verify github --repository %s <file>\n```\n\n' "${GITHUB_REPOSITORY}"
          printf 'SHA256SUMS:\n\n```text\n'
          cat "${DIST}/SHA256SUMS"
          printf '```\n'
        } >>"${GITHUB_STEP_SUMMARY}"

    - name: 4.2 Report failed check
      id: report
      if: failure()
      shell: bash
      run: |
        id=unexpected
        if [ -s "${RUNNER_TEMP}/failed-check" ]; then
          id="$(cat "${RUNNER_TEMP}/failed-check")"
        fi
        echo "failed-check=${id}" >>"${GITHUB_OUTPUT}"
