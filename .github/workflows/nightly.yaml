# Nightly workflow testing the latest released action, to catch regressions in
# what consumers pick up. The current (unreleased) code is tested nightly by ci.yaml. It also runs the
# contract test between the current code and build-pypi-package-action (ci-contract.yaml).
#
# Permissions are set at the job level, not the workflow level.

name: Nightly Tests
on:
  schedule:
    - cron: "30 10 * * *" # run at 10:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Load the shared OS matrix from the default config of
  # durandtibo/workflow-config-action once.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  # Test the latest released action
  test-released:
    needs: get-matrix
    uses: ./.github/workflows/ci-action.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
      released: true
    permissions:
      contents: write # create/delete the throwaway draft release and attach assets
      id-token: write # Sigstore OIDC keyless signing

  # Test the contract between this action and the build action that produces its input
  test-contract:
    uses: ./.github/workflows/ci-contract.yaml
    permissions:
      contents: read
      id-token: write # Sigstore OIDC keyless signing
