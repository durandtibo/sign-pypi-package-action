# Tests this composite action end-to-end, across Linux/macOS/Windows: it
# creates a throwaway GitHub release/tag, signs a fixture package's
# distributions with Sigstore, and attaches them to that release, then
# deletes the release/tag again. Also tests its checksum-verification
# failure paths (reject-tampered-checksums, reject-unlisted-file,
# reject-missing-checksums), which aren't OS-dependent so only run on
# ubuntu-latest.

name: Test Local Action

on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      os_all: ${{ steps.cfg.outputs.os_all }}
    steps:
      - name: Load workflow config
        uses: durandtibo/workflow-config-action@6a12598cf8ab42549b10a25432394dd826bffa59 # ratchet:durandtibo/workflow-config-action@v0.1
        id: cfg

  build:
    # Signing isn't OS-dependent, so a single build here just produces the
    # one "dist" artifact this action's tests consume. Uses a plain
    # "uv build" rather than the build-pypi-package-action, to keep this
    # repo's tests independent of that other action.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        run: cp -r test/fixtures/pkg/. .

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # ratchet:astral-sh/setup-uv@v10.1.0

      - name: Build package
        run: uv build

      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz *.whl > SHA256SUMS

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  sign:
    needs: [config, build]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.config.outputs.os_all) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      id-token: write # Sigstore OIDC keyless signing
      contents: write # create/delete the throwaway release and attach assets
      actions: read # list this run's artifacts to assert "signatures" was uploaded
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # ratchet:astral-sh/setup-uv@v10.1.0

      - name: Create throwaway release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ci-sign-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "Test run $tag (throwaway, will be deleted)" \
            --notes "Created by the CI workflow, safe to ignore/delete." \
            --target "${{ github.sha }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run sign action
        uses: ./
        with:
          tag-name: ${{ steps.release.outputs.tag }}

      - name: Assert signature bundles are cryptographically valid
        # A file merely named *.sigstore.json proves nothing by itself; this
        # actually verifies each bundle's signature against Sigstore's
        # transparency log and checks it was produced by a workflow run in
        # this repository, catching e.g. a signing step that emits
        # well-formed but bogus/self-signed bundles.
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_sigstore_valid "${{ github.repository }}" dist/*.tar.gz dist/*.whl

      - name: Assert signatures artifact was uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          source scripts/test-helper.sh
          assert_signatures_artifact_uploaded "${{ github.run_id }}"

      - name: Assert all expected assets were attached to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          source scripts/test-helper.sh
          assert_release_assets "${{ steps.release.outputs.tag }}"

      - name: Delete throwaway release and tag
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" --yes --cleanup-tag || true

  reject-tampered-checksums:
    # sign must fail closed if the downloaded "dist" artifact doesn't match
    # the checksums recorded at build time, before signing anything or
    # touching a release. Doesn't need id-token/contents permissions since
    # it never reaches those steps.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        run: cp -r test/fixtures/pkg/. .

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # ratchet:astral-sh/setup-uv@v10.1.0

      - name: Build package
        run: uv build

      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz *.whl > SHA256SUMS

      - name: Tamper with a built distribution
        run: echo "corrupted" >> dist/*.tar.gz

      - name: Upload dist artifact under the name sign expects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Run sign action
        id: sign
        continue-on-error: true
        uses: ./
        with:
          tag-name: ci-sign-checksum-test-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assert sign action failed
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_failure "sign (tampered checksums)" "${{ steps.sign.outcome }}"

  reject-unlisted-file:
    # sign must also fail closed if the downloaded "dist" artifact contains
    # a distribution file that isn't listed in SHA256SUMS at all (as
    # opposed to reject-tampered-checksums, which covers a listed file
    # whose contents changed). Without this check, an unlisted file would
    # skip checksum verification entirely yet still get signed and
    # released.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        run: cp -r test/fixtures/pkg/. .

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # ratchet:astral-sh/setup-uv@v10.1.0

      - name: Build package
        run: uv build

      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz *.whl > SHA256SUMS

      - name: Add an unlisted distribution file
        run: cp dist/*.whl dist/extra-unlisted-0.0.0-py3-none-any.whl

      - name: Upload dist artifact under the name sign expects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Run sign action
        id: sign
        continue-on-error: true
        uses: ./
        with:
          tag-name: ci-sign-unlisted-file-test-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assert sign action failed
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_failure "sign (unlisted file)" "${{ steps.sign.outcome }}"

  reject-missing-checksums:
    # sign must fail closed if the downloaded "dist" artifact has no
    # SHA256SUMS file at all, rather than e.g. treating an empty/absent
    # checksum list as "nothing to verify" and signing unverified files.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        run: cp -r test/fixtures/pkg/. .

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # ratchet:astral-sh/setup-uv@v10.1.0

      - name: Build package
        run: uv build

      - name: Upload dist artifact without SHA256SUMS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Run sign action
        id: sign
        continue-on-error: true
        uses: ./
        with:
          tag-name: ci-sign-missing-checksums-test-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assert sign action failed
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_failure "sign (missing SHA256SUMS)" "${{ steps.sign.outcome }}"
