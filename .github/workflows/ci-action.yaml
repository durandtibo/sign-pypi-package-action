# The integration tier: end-to-end tests of this composite action on GitHub runners, for both the
# code in this checkout (released: false, uses: ./) and the last released tag (released: true), so
# the two never drift apart. They check what the unit tier (`make test-local`, which runs every row
# of test/cases.json against fakes) cannot: that the real artifact service, the real Sigstore and the
# real `gh` behave as the fakes assume. Keep it small: each job below makes few or no GitHub API
# calls, to stay clear of the rate limit of the token.
#
# - build: builds the fixture package once and uploads it as "dist-base".
# - sign: across Linux/macOS, runs the action with the fake gh of test/fake-gh (a release in a local
#   store, no GitHub API call, no contents: write), with the real artifact download and the real
#   Sigstore signing. Verifies the bundles, that the release holds exactly the expected assets
#   (byte-identical to the dist) and that a consumer can verify the assets.
# - release: the contract test of the fake gh. Creates a throwaway draft release (never public, no
#   tag), runs the action with the real gh, checks the same things as sign, then deletes the release.
#   About 10 API calls per job, on Linux only.
#   Skipped when real-release is false (a pull request that
#   changes nothing that could make the fake drift from gh).
# - case: the rows of test/cases.json flagged "integration" (and not "local"): they need the real
#   artifact service, name an existing-or-not artifact to download and must be rejected before any
#   release call, so they need no release, no gh and no staging. The other rows run in the unit tier.
# - permissions: runs the action on the good dist in a job without id-token: write and asserts the
#   "permissions" id (permissions are per job, so this check cannot be a row of the case job).
#
# The released version (v0.1.0) supports every row flagged "released": true in test/cases.json. At
# release time: flag the rows the new version supports, bump the SHA below (and the ratchet comment),
# and delete the helpers that only existed for the old tag.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
      released:
        description: "Test the last released tag instead of this checkout"
        required: false
        default: false
        type: boolean
      real-release:
        description: "Run the release job, which creates a throwaway draft release with the real gh"
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  build:
    # Signing isn't OS-dependent, so a single build here produces the one
    # distribution set all tests consume. Uses a plain "uv build" rather than
    # the build-pypi-package-action, to keep this repo's tests independent of it.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3

      - name: Build package
        run: uv build test/fixtures/pkg --out-dir dist

      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz *.whl > SHA256SUMS

      - name: Load test cases
        id: cases
        env:
          RELEASED: ${{ inputs.released }}
        run: |
          # Only the rows that need the real artifact service run here; the others run in `make test-local`.
          # With released: true only the rows flagged "released" run.
          echo "cases=$(jq -c --argjson r "${RELEASED}" 'map(select(.integration == true and .local != true and ($r == false or .released == true)))' test/cases.json)" >> "$GITHUB_OUTPUT"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: dist-base
          path: dist/
          retention-days: 1

  sign:
    # The release is a directory of the fake gh: no API call. The artifact download and the Sigstore
    # signing are real.
    needs: [build]
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore OIDC keyless signing
      contents: read
    env:
      TAG: ci-sign-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3

      - name: Use the fake gh with a draft release
        # The tag is pushed and a draft release exists, as a user could have prepared.
        shell: bash
        run: |
          source scripts/test-helper.sh
          use_fake_gh "${RUNNER_TEMP}/fake-gh-store" new "${TAG}"

      - name: Run sign action (this checkout)
        if: ${{ !inputs.released }}
        uses: ./
        with:
          tag-name: ${{ env.TAG }}
          dist-artifact-name: dist-base

      - name: Run sign action (released)
        if: ${{ inputs.released }}
        uses: durandtibo/sign-pypi-package-action@27337599193dc08605604ca7dd844528833f78b0 # ratchet:durandtibo/sign-pypi-package-action@v0.1.0
        with:
          tag-name: ${{ env.TAG }}
          dist-artifact-name: dist-base

      - name: Assert the action used the fake gh
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_fake_gh_used "${RUNNER_TEMP}/fake-gh-store"

      - name: Assert signature bundles are cryptographically valid
        # A file merely named *.sigstore.json proves nothing by itself; this
        # verifies each bundle against Sigstore's transparency log and checks it
        # was produced by a workflow run in this repository.
        shell: bash
        run: |
          source scripts/test-helper.sh
          dist="${RUNNER_TEMP}/sign-pypi-package"
          assert_sigstore_valid "${GITHUB_REPOSITORY}" "${dist}"/*.tar.gz "${dist}"/*.whl "${dist}/SHA256SUMS"

      - name: Assert the release holds exactly the expected assets
        # No missing and no extra asset, and each uploaded file is identical to the checksummed one.
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_fake_release_matches_dist "${RUNNER_TEMP}/fake-gh-store" "${TAG}" "${RUNNER_TEMP}/sign-pypi-package"

      - name: Assert a consumer can verify the release assets
        # What the README tells users to do: take the assets of the release, verify with the bundle.
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_fake_release_verifies "${RUNNER_TEMP}/fake-gh-store" "${TAG}" "${GITHUB_REPOSITORY}"

  release:
    # The contract test of the fake gh: the same checks as the sign job, against a real release.
    # Only drafts are created (no public release, no tag): see CLAUDE.md.
    if: ${{ inputs.real-release }}
    needs: [build]
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore OIDC keyless signing
      contents: write # create/delete the throwaway draft release and attach assets
    env:
      TAG: ci-release-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3

      - name: Create throwaway draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/test-helper.sh
          create_draft_release "${TAG}"

      - name: Run sign action (this checkout)
        if: ${{ !inputs.released }}
        uses: ./
        with:
          tag-name: ${{ env.TAG }}
          dist-artifact-name: dist-base

      - name: Run sign action (released)
        if: ${{ inputs.released }}
        uses: durandtibo/sign-pypi-package-action@27337599193dc08605604ca7dd844528833f78b0 # ratchet:durandtibo/sign-pypi-package-action@v0.1.0
        with:
          tag-name: ${{ env.TAG }}
          dist-artifact-name: dist-base

      - name: Assert signature bundles are cryptographically valid
        shell: bash
        run: |
          source scripts/test-helper.sh
          dist="${RUNNER_TEMP}/sign-pypi-package"
          assert_sigstore_valid "${GITHUB_REPOSITORY}" "${dist}"/*.tar.gz "${dist}"/*.whl "${dist}/SHA256SUMS"

      - name: Assert the release holds exactly the expected assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/test-helper.sh
          assert_release_matches_dist "${TAG}" "${RUNNER_TEMP}/sign-pypi-package" true

      - name: Assert a consumer can verify the downloaded release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/test-helper.sh
          assert_release_verifies "${TAG}" "${GITHUB_REPOSITORY}" true

      - name: Delete throwaway draft release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/test-helper.sh
          delete_release "${TAG}"

  case:
    # One row of test/cases.json per job, for the rows flagged "integration": they download an
    # artifact that does not exist (the "artifact" field) and must be rejected before any release
    # call, so no release, no gh and no staged artifact is needed. Row fields used: name, expected
    # (failed-check id) and artifact.
    needs: [build]
    if: needs.build.outputs.cases != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.cases) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ci-case-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Run sign action (this checkout)
        id: local
        if: ${{ !inputs.released }}
        continue-on-error: true
        uses: ./
        with:
          tag-name: ${{ env.TAG }}
          dist-artifact-name: ${{ matrix.artifact }}

      - name: Run sign action (released)
        id: released
        if: ${{ inputs.released }}
        continue-on-error: true
        uses: durandtibo/sign-pypi-package-action@27337599193dc08605604ca7dd844528833f78b0 # ratchet:durandtibo/sign-pypi-package-action@v0.1.0
        with:
          tag-name: ${{ env.TAG }}
          dist-artifact-name: ${{ matrix.artifact }}

      - name: Assert the expected check failed
        shell: bash
        env:
          LABEL: ${{ matrix.name }}
          EXPECTED: ${{ matrix.expected }}
          ACTUAL_ID: ${{ steps.local.outputs.failed-check || steps.released.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failed_check "${LABEL}" "${EXPECTED}" "${ACTUAL_ID}"

  permissions:
    # Without id-token: write the action must stop before signing, with the
    # "permissions" id.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # no id-token on purpose
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Run sign action without id-token permission (this checkout)
        id: local
        if: ${{ !inputs.released }}
        continue-on-error: true
        uses: ./
        with:
          tag-name: ci-permissions-${{ github.run_id }}-${{ github.run_attempt }}
          dist-artifact-name: dist-base

      - name: Run sign action without id-token permission (released)
        id: released
        if: ${{ inputs.released }}
        continue-on-error: true
        uses: durandtibo/sign-pypi-package-action@27337599193dc08605604ca7dd844528833f78b0 # ratchet:durandtibo/sign-pypi-package-action@v0.1.0
        with:
          tag-name: ci-permissions-${{ github.run_id }}-${{ github.run_attempt }}
          dist-artifact-name: dist-base

      - name: Assert the permissions check failed
        shell: bash
        env:
          ACTUAL: ${{ steps.local.outputs.failed-check || steps.released.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failed_check "no-oidc" "permissions" "${ACTUAL}"
