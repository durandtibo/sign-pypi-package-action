# Tests this composite action end-to-end, across Linux/macOS/Windows: it
# creates a throwaway GitHub release/tag, signs a fixture package's
# distributions with Sigstore, and attaches them to that release, then
# deletes the release/tag again. Also runs every row of test/cases.json
# (accept and reject jobs): each stages a modified copy of the built dist,
# runs the action on it and asserts the exact failed-check id. These checks
# aren't OS-dependent so only run on ubuntu-latest.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  build:
    # Signing isn't OS-dependent, so a single build here just produces the
    # one "dist" artifact this action's tests consume. Uses a plain
    # "uv build" rather than the build-pypi-package-action, to keep this
    # repo's tests independent of that other action.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accept: ${{ steps.cases.outputs.accept }}
      reject: ${{ steps.cases.outputs.reject }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        run: cp -r test/fixtures/pkg/. .

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3

      - name: Build package
        run: uv build

      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz *.whl > SHA256SUMS

      - name: Load test cases
        id: cases
        run: |
          echo "accept=$(jq -c .accept test/cases.json)" >> "$GITHUB_OUTPUT"
          echo "reject=$(jq -c .reject test/cases.json)" >> "$GITHUB_OUTPUT"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  sign:
    needs: [build]
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      id-token: write # Sigstore OIDC keyless signing
      contents: write # create/delete the throwaway release and attach assets
      actions: read # list this run's artifacts to assert "signatures" was uploaded
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3

      - name: Create throwaway release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ci-sign-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "Test run $tag (throwaway, will be deleted)" \
            --notes "Created by the CI workflow, safe to ignore/delete." \
            --target "${{ github.sha }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run sign action
        uses: ./
        with:
          tag-name: ${{ steps.release.outputs.tag }}

      - name: Assert signature bundles are cryptographically valid
        # A file merely named *.sigstore.json proves nothing by itself; this
        # actually verifies each bundle's signature against Sigstore's
        # transparency log and checks it was produced by a workflow run in
        # this repository, catching e.g. a signing step that emits
        # well-formed but bogus/self-signed bundles.
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_sigstore_valid "${{ github.repository }}" "${RUNNER_TEMP}"/dist/*.tar.gz "${RUNNER_TEMP}"/dist/*.whl

      - name: Assert signatures artifact was uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          source scripts/test-helper.sh
          assert_signatures_artifact_uploaded "${{ github.run_id }}"

      - name: Assert all expected assets were attached to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          source scripts/test-helper.sh
          assert_release_assets "${{ steps.release.outputs.tag }}"

      - name: Delete throwaway release and tag
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" --yes --cleanup-tag || true

  accept:
    # Rows of test/cases.json that the action must accept: it runs to the end
    # (throwaway release included) and reports no failed check.
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.accept) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # Sigstore OIDC keyless signing
      contents: write # create/delete the throwaway release and attach assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Download base distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: dist
          path: case-dist

      - name: Stage case
        shell: bash
        env:
          STAGE: ${{ matrix.stage }}
        run: cd case-dist && bash -euo pipefail -c "${STAGE}"

      - name: Upload staged distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: case-dist/
          retention-days: 1

      - name: Create throwaway release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ci-accept-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Test run ${TAG} (throwaway, will be deleted)" \
            --notes "Created by the CI workflow, safe to ignore/delete." \
            --target "${GITHUB_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run sign action
        id: sign
        continue-on-error: true
        uses: ./
        with:
          tag-name: ${{ steps.release.outputs.tag }}
          dist-artifact-name: dist-${{ matrix.name }}

      - name: Assert no check failed
        shell: bash
        env:
          LABEL: ${{ matrix.name }}
          EXPECTED: ${{ matrix.expected }}
          ACTUAL: ${{ steps.sign.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failed_check "${LABEL}" "${EXPECTED}" "${ACTUAL}"

      - name: Delete throwaway release and tag
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true

  reject:
    # Rows of test/cases.json that the action must reject with the expected
    # failed-check id, before signing or touching a release. Needs no
    # id-token/contents: write permissions since it never reaches those steps.
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.reject) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Download base distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: dist
          path: case-dist

      - name: Stage case
        shell: bash
        env:
          STAGE: ${{ matrix.stage }}
        run: cd case-dist && bash -euo pipefail -c "${STAGE}"

      - name: Upload staged distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: case-dist/
          retention-days: 1

      - name: Run sign action
        id: sign
        continue-on-error: true
        uses: ./
        with:
          # no_tag rows leave tag-name unset: the run is not a tag push.
          tag-name: ${{ !matrix.no_tag && format('ci-reject-{0}-{1}-{2}', matrix.name, github.run_id, github.run_attempt) || '' }}
          dist-artifact-name: dist-${{ matrix.name }}

      - name: Assert the expected check failed
        shell: bash
        env:
          LABEL: ${{ matrix.name }}
          EXPECTED: ${{ matrix.expected }}
          ACTUAL: ${{ steps.sign.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failed_check "${LABEL}" "${EXPECTED}" "${ACTUAL}"
