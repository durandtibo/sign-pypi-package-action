# End-to-end test suite of this composite action, for both the code in this
# checkout (released: false, uses: ./) and the last released tag
# (released: true), so the two never drift apart.
#
# - build: builds the fixture package once and uploads it as "dist-base".
# - sign: across Linux/macOS/Windows, creates a throwaway release, runs the
#   action, verifies the Sigstore bundles and the asset set, deletes the release.
# - accept / reject / repeat: one job per row of test/cases.json. Each stages a
#   modified copy of dist-base and asserts the exact failed-check id. They are
#   not OS-dependent so only run on ubuntu-latest.
#
# The released version (v0.0.1) has neither the failed-check output nor the
# dist-artifact-name input, so no row is flagged "released": true yet. At release
# time: flag the rows the new version supports, bump the SHA below (and
# the ratchet comment), and drop the extra "dist" upload of the build job.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
      released:
        description: "Test the last released tag instead of this checkout"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  build:
    # Signing isn't OS-dependent, so a single build here produces the one
    # distribution set all tests consume. Uses a plain "uv build" rather than
    # the build-pypi-package-action, to keep this repo's tests independent of it.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accept: ${{ steps.cases.outputs.accept }}
      reject: ${{ steps.cases.outputs.reject }}
      repeat: ${{ steps.cases.outputs.repeat }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3

      - name: Build package
        run: uv build test/fixtures/pkg --out-dir dist

      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz *.whl > SHA256SUMS

      - name: Load test cases
        id: cases
        env:
          RELEASED: ${{ inputs.released }}
        run: |
          # With released: true only the rows flagged "released" run.
          for list in accept reject repeat; do
            echo "${list}=$(jq -c --argjson r "${RELEASED}" ".${list} | map(select(\$r == false or .released == true))" test/cases.json)"
          done >> "$GITHUB_OUTPUT"

      - name: Upload distributions for the cases
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: dist-base
          path: dist/
          retention-days: 1

      - name: Upload distributions as "dist" for the released action
        # The released v0.0.1 only downloads an artifact named "dist".
        if: inputs.released
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  sign:
    needs: [build]
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      id-token: write # Sigstore OIDC keyless signing
      contents: write # create/delete the throwaway release and attach assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3

      - name: Create throwaway release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ci-sign-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Test run ${TAG} (throwaway, will be deleted)" \
            --notes "Created by the CI workflow, safe to ignore/delete." \
            --target "${GITHUB_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run sign action (this checkout)
        if: ${{ !inputs.released }}
        uses: ./
        with:
          tag-name: ${{ steps.release.outputs.tag }}

      - name: Run sign action (released)
        if: ${{ inputs.released }}
        uses: durandtibo/sign-pypi-package-action@5f8c22801ccd4af3d171e3e395fd44e40018f1f5 # ratchet:durandtibo/sign-pypi-package-action@v0.0.1
        with:
          tag-name: ${{ steps.release.outputs.tag }}

      - name: Assert signature bundles are cryptographically valid
        # A file merely named *.sigstore.json proves nothing by itself; this
        # verifies each bundle against Sigstore's transparency log and checks it
        # was produced by a workflow run in this repository. The current action
        # downloads to RUNNER_TEMP/dist, the released one to the workspace.
        shell: bash
        env:
          DIST_DIR: ${{ inputs.released && 'dist' || format('{0}/dist', runner.temp) }}
        run: |
          source scripts/test-helper.sh
          assert_sigstore_valid "${GITHUB_REPOSITORY}" "${DIST_DIR}"/*.tar.gz "${DIST_DIR}"/*.whl

      - name: Assert all expected assets were attached to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          source scripts/test-helper.sh
          assert_release_assets "${TAG}"

      - name: Delete throwaway release and tag
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true

  accept:
    # Rows of test/cases.json that the action must accept: it runs to the end
    # (throwaway release included) and reports no failed check.
    needs: [build]
    if: needs.build.outputs.accept != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.accept) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # Sigstore OIDC keyless signing
      contents: write # create/delete the throwaway release and attach assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Download base distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: dist-base
          path: case-dist

      - name: Stage case
        shell: bash
        env:
          STAGE: ${{ matrix.stage }}
        run: cd case-dist && bash -euo pipefail -c "${STAGE}"

      - name: Upload staged distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: case-dist/
          retention-days: 1

      - name: Create throwaway release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ci-accept-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Test run ${TAG} (throwaway, will be deleted)" \
            --notes "Created by the CI workflow, safe to ignore/delete." \
            --target "${GITHUB_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run sign action (this checkout)
        id: sign-local
        if: ${{ !inputs.released }}
        continue-on-error: true
        uses: ./
        with:
          tag-name: ${{ steps.release.outputs.tag }}
          dist-artifact-name: dist-${{ matrix.name }}

      - name: Run sign action (released)
        id: sign-released
        if: ${{ inputs.released }}
        continue-on-error: true
        uses: durandtibo/sign-pypi-package-action@5f8c22801ccd4af3d171e3e395fd44e40018f1f5 # ratchet:durandtibo/sign-pypi-package-action@v0.0.1
        with:
          tag-name: ${{ steps.release.outputs.tag }}
          dist-artifact-name: dist-${{ matrix.name }}

      - name: Assert no check failed
        shell: bash
        env:
          LABEL: ${{ matrix.name }}
          EXPECTED: ${{ matrix.expected }}
          RELEASED: ${{ inputs.released }}
          ACTUAL: ${{ steps.sign-local.outputs.failed-check }}
          OUTCOME: ${{ steps.sign-released.outcome }}
        run: |
          source scripts/test-helper.sh
          # The released version has no failed-check output: only its outcome is known.
          if [ "${RELEASED}" = "true" ]; then
            if [ -z "${EXPECTED}" ]; then
              assert_success "${LABEL}" "${OUTCOME}"
            else
              assert_failure "${LABEL}" "${OUTCOME}"
            fi
          else
            assert_failed_check "${LABEL}" "${EXPECTED}" "${ACTUAL}"
          fi

      - name: Delete throwaway release and tag
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true

  reject:
    # Rows of test/cases.json that the action must reject with the expected
    # failed-check id, before signing or touching a release. Needs no
    # id-token/contents: write permissions since it never reaches those steps.
    needs: [build]
    if: needs.build.outputs.reject != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.reject) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Download base distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: dist-base
          path: case-dist

      - name: Stage case
        shell: bash
        env:
          STAGE: ${{ matrix.stage }}
        run: cd case-dist && bash -euo pipefail -c "${STAGE}"

      - name: Upload staged distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: case-dist/
          retention-days: 1

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          NO_TAG: ${{ matrix.no_tag }}
          TAG: ci-reject-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # no_tag rows leave tag-name unset: the run is not a tag push.
          if [ "${NO_TAG}" = "true" ]; then TAG=""; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run sign action (this checkout)
        id: sign-local
        if: ${{ !inputs.released }}
        continue-on-error: true
        uses: ./
        with:
          tag-name: ${{ steps.tag.outputs.tag }}
          dist-artifact-name: dist-${{ matrix.name }}

      - name: Run sign action (released)
        id: sign-released
        if: ${{ inputs.released }}
        continue-on-error: true
        uses: durandtibo/sign-pypi-package-action@5f8c22801ccd4af3d171e3e395fd44e40018f1f5 # ratchet:durandtibo/sign-pypi-package-action@v0.0.1
        with:
          tag-name: ${{ steps.tag.outputs.tag }}
          dist-artifact-name: dist-${{ matrix.name }}

      - name: Assert the expected check failed
        shell: bash
        env:
          LABEL: ${{ matrix.name }}
          EXPECTED: ${{ matrix.expected }}
          RELEASED: ${{ inputs.released }}
          ACTUAL: ${{ steps.sign-local.outputs.failed-check }}
          OUTCOME: ${{ steps.sign-released.outcome }}
        run: |
          source scripts/test-helper.sh
          # The released version has no failed-check output: only its outcome is known.
          if [ "${RELEASED}" = "true" ]; then
            if [ -z "${EXPECTED}" ]; then
              assert_success "${LABEL}" "${OUTCOME}"
            else
              assert_failure "${LABEL}" "${OUTCOME}"
            fi
          else
            assert_failed_check "${LABEL}" "${EXPECTED}" "${ACTUAL}"
          fi

  repeat:
    # Rows of test/cases.json where the action runs twice on the same tag:
    # the first run must succeed and the second must fail with the expected
    # id, because release assets are never overwritten.
    needs: [build]
    if: needs.build.outputs.repeat != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.repeat) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # Sigstore OIDC keyless signing
      contents: write # create/delete the throwaway release and attach assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Create throwaway release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ci-repeat-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Test run ${TAG} (throwaway, will be deleted)" \
            --notes "Created by the CI workflow, safe to ignore/delete." \
            --target "${GITHUB_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run sign action (first run) (this checkout)
        id: first-local
        if: ${{ !inputs.released }}
        continue-on-error: true
        uses: ./
        with:
          tag-name: ${{ steps.release.outputs.tag }}
          dist-artifact-name: dist-base

      - name: Run sign action (first run) (released)
        id: first-released
        if: ${{ inputs.released }}
        continue-on-error: true
        uses: durandtibo/sign-pypi-package-action@5f8c22801ccd4af3d171e3e395fd44e40018f1f5 # ratchet:durandtibo/sign-pypi-package-action@v0.0.1
        with:
          tag-name: ${{ steps.release.outputs.tag }}
          dist-artifact-name: dist-base

      - name: Run sign action (second run, same tag) (this checkout)
        id: second-local
        if: ${{ !inputs.released }}
        continue-on-error: true
        uses: ./
        with:
          tag-name: ${{ steps.release.outputs.tag }}
          dist-artifact-name: dist-base

      - name: Run sign action (second run, same tag) (released)
        id: second-released
        if: ${{ inputs.released }}
        continue-on-error: true
        uses: durandtibo/sign-pypi-package-action@5f8c22801ccd4af3d171e3e395fd44e40018f1f5 # ratchet:durandtibo/sign-pypi-package-action@v0.0.1
        with:
          tag-name: ${{ steps.release.outputs.tag }}
          dist-artifact-name: dist-base

      - name: Assert first run succeeded and second run failed
        shell: bash
        env:
          LABEL: ${{ matrix.name }}
          EXPECTED: ${{ matrix.expected }}
          FIRST: ${{ steps.first-local.outputs.failed-check }}
          SECOND: ${{ steps.second-local.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failed_check "${LABEL} (first run)" "" "${FIRST}"
          assert_failed_check "${LABEL} (second run)" "${EXPECTED}" "${SECOND}"

      - name: Delete throwaway release and tag
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
