# End-to-end test suite of this composite action, for both the code in this
# checkout (released: false, uses: ./) and the last released tag
# (released: true), so the two never drift apart.
#
# - build: builds the fixture package once and uploads it as "dist-base".
# - sign: across Linux/macOS, creates a throwaway release, runs the
#   action, verifies the Sigstore bundles, that the release holds exactly the
#   expected assets (byte-identical to the dist) and that a consumer can verify
#   the downloaded assets, then deletes the release.
# - case: one job per row of test/cases.json. Each stages a modified copy of
#   dist-base, runs the action once or twice and asserts the exact failed-check
#   id. A rejected run must leave nothing on the release (no asset, no release
#   it would have created); an accepted one must leave exactly the expected
#   assets. Not OS-dependent, so it only runs on ubuntu-latest.
# - permissions: runs the action on the good dist in a job without id-token:
#   write and asserts the "permissions" id (permissions are per job, so this
#   check cannot be a row of the case job).
#
# The released version (v0.0.1) has neither the failed-check output nor the
# dist-artifact-name input, so no row is flagged "released": true yet. At release
# time: flag the rows the new version supports, bump the SHA below (and
# the ratchet comment), and drop the extra "dist" upload of the build job.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
      released:
        description: "Test the last released tag instead of this checkout"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  build:
    # Signing isn't OS-dependent, so a single build here produces the one
    # distribution set all tests consume. Uses a plain "uv build" rather than
    # the build-pypi-package-action, to keep this repo's tests independent of it.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3

      - name: Build package
        run: uv build test/fixtures/pkg --out-dir dist

      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz *.whl > SHA256SUMS

      - name: Load test cases
        id: cases
        env:
          RELEASED: ${{ inputs.released }}
        run: |
          # With released: true only the rows flagged "released" run.
          echo "cases=$(jq -c --argjson r "${RELEASED}" 'map(select($r == false or .released == true))' test/cases.json)" >> "$GITHUB_OUTPUT"

      - name: Upload distributions for the cases
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: dist-base
          path: dist/
          retention-days: 1

      - name: Upload distributions as "dist" for the released action
        # The released v0.0.1 only downloads an artifact named "dist".
        if: inputs.released
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  sign:
    needs: [build]
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      id-token: write # Sigstore OIDC keyless signing
      contents: write # create/delete the throwaway release and attach assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3

      - name: Create throwaway release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ci-sign-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Test run ${TAG} (throwaway, will be deleted)" \
            --notes "Created by the CI workflow, safe to ignore/delete." \
            --target "${GITHUB_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run sign action (this checkout)
        if: ${{ !inputs.released }}
        uses: ./
        with:
          tag-name: ${{ steps.release.outputs.tag }}
          dist-artifact-name: dist-base

      - name: Run sign action (released)
        if: ${{ inputs.released }}
        uses: durandtibo/sign-pypi-package-action@5f8c22801ccd4af3d171e3e395fd44e40018f1f5 # ratchet:durandtibo/sign-pypi-package-action@v0.0.1
        with:
          tag-name: ${{ steps.release.outputs.tag }}

      - name: Assert signature bundles are cryptographically valid
        # A file merely named *.sigstore.json proves nothing by itself; this
        # verifies each bundle against Sigstore's transparency log and checks it
        # was produced by a workflow run in this repository. The current action
        # downloads to RUNNER_TEMP/sign-pypi-package, the released one to the workspace.
        shell: bash
        env:
          RELEASED: ${{ inputs.released }}
          DIST_DIR: ${{ inputs.released && 'dist' || format('{0}/sign-pypi-package', runner.temp) }}
        run: |
          source scripts/test-helper.sh
          assert_sigstore_valid "${GITHUB_REPOSITORY}" "${DIST_DIR}"/*.tar.gz "${DIST_DIR}"/*.whl
          # The checksums file is signed too, except by the released v0.0.1.
          if [ "${RELEASED}" != "true" ]; then
            assert_sigstore_valid "${GITHUB_REPOSITORY}" "${DIST_DIR}/SHA256SUMS"
          fi

      - name: Assert the release holds exactly the expected assets
        # No missing and no extra asset, and each uploaded file is identical to the checksummed one.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SUMS_BUNDLE: ${{ !inputs.released }}
          DIST_DIR: ${{ inputs.released && 'dist' || format('{0}/sign-pypi-package', runner.temp) }}
        run: |
          source scripts/test-helper.sh
          assert_release_matches_dist "${TAG}" "${DIST_DIR}" "${SUMS_BUNDLE}"

      - name: Assert a consumer can verify the downloaded release assets
        # What the README tells users to do: download from the release, verify with the bundle.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SUMS_BUNDLE: ${{ !inputs.released }}
        run: |
          source scripts/test-helper.sh
          assert_release_verifies "${TAG}" "${GITHUB_REPOSITORY}" "${SUMS_BUNDLE}"

      - name: Delete throwaway release and tag
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true

  case:
    # One row of test/cases.json per job. Row fields: name, stage (shell snippet
    # that mutates a copy of the good dist/), expected (failed-check id, "" =
    # accepted), and optionally released, runs (1 default, 2 = run the action
    # twice), artifact and tag:
    #   new         (default) a throwaway release and tag exist
    #   same        like new; with runs: 2 the second run reuses the tag
    #   unreleased  the tag exists but the release does not (the action creates it)
    #   missing     neither the tag nor the release exists
    #   none        tag-name is left unset, as in a run that is not a tag push
    #   dash, space tag-name is invalid ("-bad..." or "bad tag"): no tag or release exists
    #   draft       the tag exists and so does a draft release, which must stay a draft
    # The optional artifact field names the artifact to download instead of the staged one.
    # With runs: 2 the first run uses the good dist-base on the tag and the
    # second one the staged artifact: a second tag for "new", the tag for "same".
    # Rows are asserted on the last run; the first run must succeed.
    needs: [build]
    if: needs.build.outputs.cases != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.cases) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore OIDC keyless signing
      actions: read # list the staged artifact
      contents: write # create/delete the throwaway release and tag, attach assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Download base distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: dist-base
          path: case-dist

      - name: Stage case
        shell: bash
        env:
          STAGE: ${{ matrix.stage }}
        run: cd case-dist && bash -euo pipefail -c "${STAGE}"

      - name: Upload staged distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: case-dist/
          retention-days: 1
          include-hidden-files: true # the hidden-file row stages a dotfile

      - name: Wait until the staged artifact is visible
        # The artifact service is eventually consistent: a download right after the upload can
        # fail with "Artifact not found", which the action under test would report as unexpected.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: dist-${{ matrix.name }}
        run: |
          for _ in $(seq 1 30); do
            # Filter by name: the unfiltered listing is paginated (30 per page) and the run has more artifacts.
            n=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              -f name="${NAME}" --jq '.artifacts | length' 2>/dev/null || echo 0)
            if [ "${n}" != "0" ]; then
              sleep 5 # the download backend can lag behind the listing
              exit 0
            fi
            sleep 2
          done
          echo "::error::artifact ${NAME} did not become visible"
          exit 1

      - name: Create throwaway tag and release
        id: setup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ matrix.tag || 'new' }}
          RUNS: ${{ matrix.runs || 1 }}
          BASE: ci-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          source scripts/test-helper.sh
          case "${KIND}" in
            none) tag="" ;;
            dash) tag="-bad-${BASE}" ;;
            space) tag="bad tag ${BASE}" ;;
            missing | unreleased | new | same | draft) tag="${BASE}" ;;
            *)
              echo "::error::unknown tag kind '${KIND}' in test/cases.json"
              exit 1
              ;;
          esac
          # The tag of the second run: the same one for "same", a new one for "new".
          tag2="${tag}"
          if [ "${RUNS}" = "2" ] && [ "${KIND}" = "new" ]; then tag2="${BASE}-2"; fi
          # Prepare each distinct tag once: creating the same release twice fails with HTTP 422.
          for t in "${tag}" "${tag2}"; do
            [ -n "${t}" ] || continue
            [ "${t}" != "${prev:-}" ] || continue
            prev="${t}"
            case "${KIND}" in
              new | same) create_release "${t}" ;;
              unreleased) create_tag "${t}" ;;
              draft) create_draft_release "${t}" ;;
            esac
          done
          { echo "tag=${tag}"; echo "tag2=${tag2}"; } >>"${GITHUB_OUTPUT}"

      - name: Run sign action (first run) (this checkout)
        id: first-local
        if: ${{ !inputs.released }}
        continue-on-error: true
        uses: ./
        with:
          tag-name: ${{ steps.setup.outputs.tag }}
          dist-artifact-name: ${{ matrix.runs == 2 && 'dist-base' || matrix.artifact || format('dist-{0}', matrix.name) }}

      - name: Run sign action (first run) (released)
        id: first-released
        if: ${{ inputs.released }}
        continue-on-error: true
        uses: durandtibo/sign-pypi-package-action@5f8c22801ccd4af3d171e3e395fd44e40018f1f5 # ratchet:durandtibo/sign-pypi-package-action@v0.0.1
        with:
          tag-name: ${{ steps.setup.outputs.tag }}
          dist-artifact-name: ${{ matrix.runs == 2 && 'dist-base' || matrix.artifact || format('dist-{0}', matrix.name) }}

      - name: Run sign action (second run) (this checkout)
        id: second-local
        if: ${{ !inputs.released && matrix.runs == 2 }}
        continue-on-error: true
        uses: ./
        with:
          tag-name: ${{ steps.setup.outputs.tag2 }}
          dist-artifact-name: ${{ matrix.artifact || format('dist-{0}', matrix.name) }}

      - name: Run sign action (second run) (released)
        id: second-released
        if: ${{ inputs.released && matrix.runs == 2 }}
        continue-on-error: true
        uses: durandtibo/sign-pypi-package-action@5f8c22801ccd4af3d171e3e395fd44e40018f1f5 # ratchet:durandtibo/sign-pypi-package-action@v0.0.1
        with:
          tag-name: ${{ steps.setup.outputs.tag2 }}
          dist-artifact-name: ${{ matrix.artifact || format('dist-{0}', matrix.name) }}

      - name: Assert the expected check failed
        shell: bash
        env:
          LABEL: ${{ matrix.name }}
          EXPECTED: ${{ matrix.expected }}
          RUNS: ${{ matrix.runs || 1 }}
          RELEASED: ${{ inputs.released }}
          FIRST_ID: ${{ steps.first-local.outputs.failed-check }}
          SECOND_ID: ${{ steps.second-local.outputs.failed-check }}
          FIRST_OUTCOME: ${{ steps.first-released.outcome }}
          SECOND_OUTCOME: ${{ steps.second-released.outcome }}
        run: |
          source scripts/test-helper.sh
          # The released version has no failed-check output: only its outcome is known.
          if [ "${RELEASED}" = "true" ]; then
            last="${FIRST_OUTCOME}"
            if [ "${RUNS}" = "2" ]; then
              assert_success "${LABEL} (first run)" "${FIRST_OUTCOME}"
              last="${SECOND_OUTCOME}"
            fi
            if [ -z "${EXPECTED}" ]; then
              assert_success "${LABEL}" "${last}"
            else
              assert_failure "${LABEL}" "${last}"
            fi
          else
            last="${FIRST_ID}"
            if [ "${RUNS}" = "2" ]; then
              assert_failed_check "${LABEL} (first run)" "" "${FIRST_ID}"
              last="${SECOND_ID}"
            fi
            assert_failed_check "${LABEL}" "${EXPECTED}" "${last}"
          fi

      - name: Assert an accepted run released exactly the distributions
        # The last run's tag holds the assets of the dist it was given, nothing else.
        if: ${{ matrix.expected == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.setup.outputs.tag2 }}
          SUMS_BUNDLE: ${{ !inputs.released }}
        run: |
          source scripts/test-helper.sh
          assert_release_matches_dist "${TAG}" case-dist "${SUMS_BUNDLE}"

      - name: Assert the release created by the action is published
        # Only the action created it, as a draft, and published it after the upload.
        if: ${{ matrix.tag == 'unreleased' && matrix.expected == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.setup.outputs.tag }}
        run: |
          source scripts/test-helper.sh
          assert_release_published "${TAG}"

      - name: Assert a release that was a draft is still a draft
        # The action only adds to a release that exists; publishing it is not its call.
        if: ${{ matrix.tag == 'draft' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.setup.outputs.tag }}
        run: |
          source scripts/test-helper.sh
          assert_release_draft "${TAG}"

      - name: Assert a rejected run attached nothing
        # A single rejected run must stop before signing and releasing, so its
        # release (if any) has no assets. With runs: 2 the first run attaches some.
        if: ${{ matrix.expected != '' && (matrix.runs || 1) == 1 }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.setup.outputs.tag }}
        run: |
          source scripts/test-helper.sh
          assert_no_assets "${TAG}"

      - name: Assert a rejected run created no release
        # Without a pushed tag the action must not leave a release (not even a draft) behind.
        if: ${{ matrix.tag == 'missing' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.setup.outputs.tag }}
        run: |
          source scripts/test-helper.sh
          assert_no_release "${TAG}"

      - name: Delete throwaway releases and tags
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.setup.outputs.tag }} ${{ steps.setup.outputs.tag2 }}
        run: |
          source scripts/test-helper.sh
          for t in ${TAGS}; do delete_release_and_tag "${t}"; done

  permissions:
    # Without id-token: write the action must stop before signing, with the
    # "permissions" id. The released v0.0.1 has no such check.
    needs: [build]
    if: ${{ !inputs.released }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # no id-token on purpose
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Run sign action without id-token permission
        id: sign
        continue-on-error: true
        uses: ./
        with:
          tag-name: ci-permissions-${{ github.run_id }}-${{ github.run_attempt }}
          dist-artifact-name: dist-base

      - name: Assert the permissions check failed
        shell: bash
        env:
          ACTUAL: ${{ steps.sign.outputs.failed-check }}
        run: |
          source scripts/test-helper.sh
          assert_failed_check "no-oidc" "permissions" "${ACTUAL}"
