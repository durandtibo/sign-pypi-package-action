# Formatting and linting workflow.
# Checks that the YAML, Makefile, shell and Markdown files follow the repo's
# formatting rules, and runs the whole `make lint` (YAML, Makefile, shell,
# Markdown and GitHub Actions workflow files).

name: Format
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  format:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Format
        run: |
          make format

      - name: Check for changes
        run: |
          git diff --exit-code

  lint:
    # The whole `make lint`: yamllint, checkmake, shellcheck, markdownlint and
    # actionlint. The repo-level configs (.yamllint.yaml, .markdownlint.yaml,
    # checkmake.ini) keep the shared .make/ directory untouched.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Lint
        run: |
          make lint
