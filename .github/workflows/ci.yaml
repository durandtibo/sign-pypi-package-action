# Main CI workflow that orchestrates all quality checks and tests.
# Runs on pull requests, pushes to main, a nightly schedule, and manual dispatch.
# It tests the current repository code, including the action
# that is not released yet. The latest released action is tested by nightly.yaml.
#
# Deliberately NOT called from here, with its own trigger:
#   - ci-verify-workflows.yaml: lints .github/workflows/* itself.
#
# Permissions are set at the job level, not the workflow level.
#
# The individual check jobs below call out to per-check reusable workflows
# (ci-format.yaml, ci-shell.yaml, ci-action.yaml) instead of inlining their steps here, so each
# check can still be run on its own.

name: CI
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC to catch issues from external changes
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Load the shared OS matrix from the default config of
  # durandtibo/workflow-config-action once, and pass it down to every job
  # below that needs it.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  # Verify formatting and linting of the repository files
  format:
    uses: ./.github/workflows/ci-format.yaml
    permissions:
      contents: read

  # Run the local tests of the action's shell steps on multiple OS
  shell:
    needs: get-matrix
    uses: ./.github/workflows/ci-shell.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  # Test the action from the current repository code (not released yet) on multiple OS
  action:
    needs: get-matrix
    uses: ./.github/workflows/ci-action.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
      released: false
    permissions:
      actions: read # list the staged artifact
      contents: write # create/delete the throwaway draft release and attach assets
      id-token: write # Sigstore OIDC keyless signing
