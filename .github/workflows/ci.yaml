# Main CI workflow that orchestrates all quality checks and tests.
# Runs on pull requests, pushes to main, a nightly schedule, and manual dispatch.
# It tests the current repository code, including the action
# that is not released yet. The latest released action is tested by nightly.yaml.
#
# Deliberately NOT called from here, with its own trigger:
#   - ci-verify-workflows.yaml: lints .github/workflows/* itself.
#
# Permissions are set at the job level, not the workflow level.
#
# The individual check jobs below call out to per-check reusable workflows
# (ci-format.yaml, ci-shell.yaml, ci-action.yaml) instead of inlining their steps here, so each
# check can still be run on its own.

name: CI
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC to catch issues from external changes
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Load the shared OS matrix from the default config of
  # durandtibo/workflow-config-action once, and pass it down to every job
  # below that needs it.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  # Verify formatting and linting of the repository files
  format:
    uses: ./.github/workflows/ci-format.yaml
    permissions:
      contents: read

  # Run the local tests of the action's shell steps on multiple OS
  shell:
    needs: get-matrix
    uses: ./.github/workflows/ci-shell.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  # Decide whether this run needs the release job of ci-action.yaml, which creates a throwaway draft
  # release with the real gh (a few API calls). The pull requests that change nothing that could make
  # the fake gh of the tests drift from the real one skip it; every other trigger runs it.
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      real-release: ${{ steps.diff.outputs.real-release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0 # the base of a pull request must be reachable for the diff

      - name: Decide whether the release job runs
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          real=true
          if [ "${EVENT}" = pull_request ]; then
            changed="$(git diff --name-only "${BASE_SHA}" HEAD)"
            # What the real gh behaviour matters to: the action, the fake, the fixtures and the workflows that run them.
            if ! grep -qE '^(action\.yml|test/fake-gh/|test/fixtures/|scripts/(test-helper|fake-runner)\.sh|\.github/workflows/(ci|ci-action|nightly)\.yaml)' <<<"${changed}"; then
              real=false
            fi
          fi
          echo "real-release=${real}" >>"${GITHUB_OUTPUT}"
          echo "real-release=${real}"

  # Test the action from the current repository code (not released yet) on multiple OS
  action:
    needs: [get-matrix, changes]
    uses: ./.github/workflows/ci-action.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
      released: false
      real-release: ${{ needs.changes.outputs.real-release == 'true' }}
    permissions:
      contents: write # create/delete the throwaway draft release of the release job
      id-token: write # Sigstore OIDC keyless signing
