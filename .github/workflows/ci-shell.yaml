# Shell tests workflow.
# Runs, on multiple operating systems, the tests of the bash steps of action.yml that need no
# GitHub runner features (the unit tier): the escaping of the failure helper (step 0.1), every row
# of test/cases.json run through the whole action with a fake artifact download, signer and gh
# (scripts/fake-runner.sh), and the tests of each step. Real signing, the real artifact service and
# real releases are tested by ci-action.yaml.

name: Shell Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
  workflow_dispatch: # to trigger manually, with the default Linux runner
    inputs:
      test-matrix:
        description: "JSON test matrix (see lib-get-test-matrix.yaml)"
        required: false
        default: '{"os_matrix": ["ubuntu-latest"]}'
        type: string

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Show the version of bash
        shell: bash
        run: |
          bash --version | head -n 1

      - name: Test the escaping of the failure helper
        # Runs the helper of step 0.1 on hostile text; needs no runner features.
        shell: bash
        run: |
          source scripts/test-helper.sh
          assert_fail_helper_escapes action.yml

      - name: Run the unit tests
        # Every row of test/cases.json against the fakes, and each step in isolation.
        shell: bash
        run: |
          echo "🧪 Running tests on ${{ matrix.os }}..."
          make test-local
          echo "✅ All tests passed"
